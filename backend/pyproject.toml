[project]
name = "dclic-intelligence-backend"
version = "0.3.0"
description = "D-Clic Intelligence backend, production Copilot and Freshservice control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5,<9",
  "prometheus-client>=0.21,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
  "aiosqlite>=0.20,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The Copilot trend renderer sorts localized DD/MM display labels. The value is
# presentation-only and intentionally timezone-free; source timestamps remain UTC-aware.
"app/services/copilot.py" = ["DTZ007", "I001"]
